[project]
name = "desktop-duck-art"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = ["pillow>=11,<14", "shapely>=2,<3"]

[dependency-groups]
dev = ["ruff==0.17.4"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.uv]
package = false
